<!DOCTYPE html>

<html lang="ko">

<head>

  <meta charset="UTF-8">

  <title>회원가입</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <div class="card">

    <h1>회원가입</h1>

    <label>아이디</label>

    <input id="username">

    <label>비밀번호</label>

    <input
            id="password"
            type="password">

    <label>비밀번호 확인</label>

    <input
            id="passwordCheck"
            type="password">

    <button onclick="signup()">

      회원가입

    </button>

    <div id="message" class="message"></div>

    <div class="link">

      <a href="/login.html">

        로그인

      </a>

    </div>

  </div>

</div>

<script src="js/api.js"></script>

<script src="js/signup.js"></script>

</body>

</html>
